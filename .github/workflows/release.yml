name: Release VPK

# Triggered by pushing a version tag (e.g. v0.1.0). Builds the same pipeline
# documented in docs-site/installation.md (engine, then glide3x.dll, then
# the VPK), forced to channel=release, and attaches the resulting VPK to a
# GitHub Release named after the tag.
#
# glide3x.dll (tools/build_glide_ring.sh) is a SEPARATE cross-compile
# (i686-w64-mingw32-gcc, a Windows PE DLL) from the Vita ARM build — easy to
# forget because it's a one-off on the maintainer's own machine, never
# rebuilt in a normal dev loop. v0.1.3's tag (the first real run of this
# workflow) failed exactly this way: build_rt_boot_vpk.sh hard-FATALs if
# build-glide/glide3x.dll is missing (it must travel inside the VPK, or the
# game halts at frame 0 — "unsupported graphics mode"), and a fresh checkout
# has no such file. The MinGW toolchain isn't in vitasdk/vitasdk:latest
# either, hence the explicit install step below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark repo safe for git (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build engine (winx86, target Vita)
        run: TARGET=vita bash third_party/winx86/build.sh

      - name: Install MinGW (glide3x.dll cross-compiler)
        run: apt-get update -qq && apt-get install -y -qq gcc-mingw-w64-i686

      - name: Build glide3x.dll
        run: bash tools/build_glide_ring.sh

      - name: Build release VPK
        run: D2VPK_CHANNEL=release D2VPK_REBUILD=1 bash tools/build_rt_boot_vpk.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build-vita/d2vita.vpk
          generate_release_notes: true
